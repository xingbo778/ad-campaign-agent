version: '3.8'

services:
  product_service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PRODUCT_SERVICE_PORT=8001
      - LOG_LEVEL=INFO
    command: uvicorn app.services.product_service.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  creative_service:
